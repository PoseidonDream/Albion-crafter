name: Update recipe data

# Run by hand from the Actions tab after a game patch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild data/items.json from ao-bin-dumps
        run: node tools/build-data.mjs
      - name: Run tests
        run: npm test
      - name: Commit if recipes changed
        run: |
          if git diff --quiet -- data/items.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git commit -m "Update recipe data from ao-bin-dumps"
          git push
